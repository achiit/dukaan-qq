
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Piece Counter HD</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:15px;
  font-family:Arial,sans-serif;
  background:#eaf5e9;
  color:#17351e;
}
.app{
  max-width:550px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:22px;
  box-shadow:0 5px 25px #0002;
}
h1{text-align:center;color:#20843b}
.subtitle{text-align:center;color:#777}
.upload{
  display:block;
  padding:25px;
  margin-top:20px;
  text-align:center;
  border:2px dashed #269747;
  border-radius:15px;
  background:#f4fff3;
  cursor:pointer;
}
input[type=file]{display:none}
button{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#20843b;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
}
button:disabled{opacity:.5}
#preview{
  display:none;
  width:100%;
  max-height:350px;
  object-fit:contain;
  margin-top:15px;
  border-radius:12px;
}
.result{
  margin-top:20px;
  padding:20px;
  background:#e8f8e8;
  border-radius:15px;
  text-align:center;
}
.number{
  font-size:55px;
  font-weight:bold;
  color:#168638;
}
#status{
  text-align:center;
  margin-top:12px;
  font-size:13px;
}
</style>
</head>

<body>
<div class="app">

<h1>🍋 FRUIT COUNTER HD</h1>
<p class="subtitle">Smart Fruit Piece Counting App</p>

<label class="upload">
  <h3>📷 Camera / Gallery</h3>
  <p>फोटो लेने या अपलोड करने के लिए टैप करें</p>
  <input id="photo" type="file"
  accept="image/*" capture="environment">
</label>

<img id="preview">

<button id="countBtn" disabled>
🍋 COUNT FRUITS
</button>

<div id="status">पहले फोटो अपलोड करें</div>

<div class="result">
  <h3>TOTAL PIECES</h3>
  <div class="number" id="total">0</div>
  <p>कुल अनुमानित पीस</p>
</div>

</div>

<script>
const photo=document.getElementById("photo");
const preview=document.getElementById("preview");
const btn=document.getElementById("countBtn");
const total=document.getElementById("total");
const status=document.getElementById("status");

let ready=false;

photo.addEventListener("change",()=>{
  const file=photo.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    status.textContent="सही फोटो चुनें";
    return;
  }

  preview.src=URL.createObjectURL(file);
  preview.style.display="block";

  preview.onload=()=>{
    ready=true;
    btn.disabled=false;
    total.textContent="0";
    status.textContent="फोटो तैयार है। अब COUNT FRUITS दबाएँ।";
  };
});

btn.addEventListener("click",()=>{
  if(!ready)return;

  status.textContent="Counting हो रही है...";

  const max=800;
  const scale=Math.min(1,max/Math.max(
    preview.naturalWidth,preview.naturalHeight
  ));

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(preview.naturalWidth*scale);
  canvas.height=Math.round(preview.naturalHeight*scale);

  const ctx=canvas.getContext("2d");
  ctx.drawImage(preview,0,0,canvas.width,canvas.height);

  const image=ctx.getImageData(
    0,0,canvas.width,canvas.height
  ).data;

  const w=canvas.width,h=canvas.height;
  const mask=new Uint8Array(w*h);

  // Yellow colour detection
  for(let p=0,i=0;p<w*h;p++,i+=4){
    const r=image[i]/255;
    const g=image[i+1]/255;
    const b=image[i+2]/255;

    const maxc=Math.max(r,g,b);
    const minc=Math.min(r,g,b);
    const d=maxc-minc;

    let hue=0;

    if(d!==0){
      if(maxc===r)hue=60*(((g-b)/d)%6);
      else if(maxc===g)hue=60*((b-r)/d+2);
      else hue=60*((r-g)/d+4);
    }

    if(hue<0)hue+=360;

    const saturation=maxc===0?0:d/maxc;

    if(hue>=32 && hue<=78 &&
       saturation>.25 && maxc>.30){
      mask[p]=1;
    }
  }

  // Connected area counting
  const seen=new Uint8Array(w*h);
  const stack=[];
  let count=0;

  const minArea=Math.max(20,w*h*.00018);

  for(let p=0;p<w*h;p++){

    if(!mask[p] || seen[p])continue;

    seen[p]=1;
    stack.length=0;
    stack.push(p);

    let area=0;

    while(stack.length){
      const q=stack.pop();
      area++;

      const x=q%w;
      const y=Math.floor(q/w);

      const neighbors=[
        q-1,q+1,q-w,q+w
      ];

      for(const n of neighbors){
        if(n<0 || n>=w*h || seen[n] || !mask[n])
          continue;

        const nx=n%w;
        const ny=Math.floor(n/w);

        if(Math.abs(nx-x)>1 ||
           Math.abs(ny-y)>1)continue;

        seen[n]=1;
        stack.push(n);
      }
    }

    if(area>=minArea)count++;
  }

  total.textContent=count;
  status.textContent=
    count>0
    ? "फोटो में लगभग "+count+" पीले हिस्से मिले।"
    : "नींबू स्पष्ट नहीं मिले। दोबारा फोटो लें।";
});
</script>

</body>
</html>
